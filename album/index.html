<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Karim & Danya · Our Album</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Karim & Danya · Share your moments">
<meta property="og:description" content="Take a photo or a video and add it to our album">
<meta property="og:image" content="https://kazaazh.github.io/karim-and-danya/invitation/og.jpg">
<meta name="theme-color" content="#f7ede4">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Amiri:wght@400;700&display=swap">
<style>
:root{--peach:#eedac7;--sage:#a3a77d;--olive:#5d693b;--ground:#f7ede4;--ground-2:#efdfd2;--ink:#2f3620;--ink-soft:#4a5133;--rose:#c98884;
  --serif:'Cormorant Garamond','Times New Roman',serif;--script:'Pinyon Script',cursive;--ar:'Amiri',serif;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;background:radial-gradient(120% 70% at 50% 0%,#fbf4ee 0%,var(--ground) 50%,var(--ground-2) 100%) fixed;padding:env(safe-area-inset-top,0) 16px calc(40px + env(safe-area-inset-bottom,0))}
[dir="rtl"] body{font-family:var(--ar)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:440px;margin:0 auto;text-align:center}
.lang{margin:14px auto 0;width:max-content;display:flex;gap:2px;background:rgba(255,255,255,.8);box-shadow:0 2px 10px rgba(90,70,70,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;letter-spacing:.1em;cursor:pointer;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--olive);color:#fff}
.card{margin-top:16px;background:linear-gradient(180deg,#f6eeea,#f1e6e0);border:2px solid var(--olive);outline:1px solid rgba(93,105,59,.35);outline-offset:-8px;padding:34px 22px 30px;box-shadow:0 18px 40px -28px rgba(60,50,40,.6)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.42em;padding-inline-start:.42em;text-transform:uppercase;color:var(--ink-soft);margin:0;direction:ltr}
h1{font-family:var(--script);font-weight:400;font-size:46px;line-height:1.15;margin:6px 0 0}
[dir="rtl"] h1{font-family:var(--ar);font-weight:700;font-size:34px;line-height:1.5}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 0;color:var(--olive)}
.rule i{width:54px;height:1px;background:currentColor;opacity:.6}
.rule svg{width:12px;height:12px}
.lead{margin:14px auto 0;max-width:30ch;font-size:18px;font-style:italic;font-weight:500;color:var(--ink-soft)}
[dir="rtl"] .lead{font-style:normal}
.name{display:block;margin:22px auto 0;max-width:300px;text-align:start}
.name span{display:block;font-size:12.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
[dir="rtl"] .name span{letter-spacing:0;font-size:15px}
.name input{width:100%;padding:12px 14px;border:1px solid #c9ccb0;border-radius:3px;background:rgba(255,255,255,.75);font-size:17px}
.name input:focus{outline:2px solid var(--sage);outline-offset:1px}
.acts{display:grid;gap:12px;margin:22px auto 0;max-width:300px}
.act{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:62px;padding:12px 18px;border-radius:999px;border:1.5px solid var(--olive);background:linear-gradient(180deg,#b3b78e,var(--sage));color:#fff;font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;text-shadow:0 1px 1px rgba(60,70,30,.35);box-shadow:0 0 0 3px rgba(255,255,255,.55),0 8px 18px -12px rgba(60,70,30,.6);cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
[dir="rtl"] .act{letter-spacing:0;font-size:18px}
.act:active{transform:translateY(1px)}
.act svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.act.ghost{background:rgba(255,255,255,.55);color:var(--olive);text-shadow:none;border-color:rgba(93,105,59,.6);box-shadow:none;min-height:52px;font-size:13.5px}
[dir="rtl"] .act.ghost{font-size:16px}
.act input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.hintline{margin:14px auto 0;font-size:14.5px;color:var(--ink-soft);font-style:italic;max-width:32ch}
[dir="rtl"] .hintline{font-style:normal}
.status{margin:22px auto 0;max-width:320px;font-size:16px;font-weight:600;color:var(--olive);min-height:1.5em}
.queue{list-style:none;margin:12px auto 0;padding:0;max-width:320px;display:grid;gap:10px;text-align:start}
.queue li{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:8px;background:rgba(255,255,255,.6);border:1px solid rgba(93,105,59,.3);border-radius:4px}
.thumb{width:56px;height:56px;border-radius:2px;background:#e6dccf center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--olive)}
.thumb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.meta{min-width:0}
.meta b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:99px;background:rgba(93,105,59,.18);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;width:0;background:var(--olive);border-radius:99px;transition:width .25s}
.st{font-size:13px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:44px;text-align:end}
li.done .st{color:var(--olive)} li.fail .st{color:#a4453f}
li.fail .bar i{background:#a4453f}
.retry{border:1px solid #a4453f;color:#a4453f;background:none;border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.foot{margin:22px 0 0;font-size:12.5px;letter-spacing:.3em;color:var(--ink-soft);direction:ltr}
.keep{margin:10px auto 0;max-width:30ch;font-size:14px;color:#a4453f;font-weight:600}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="ar" aria-pressed="false">عربي</button></div>
  <main class="card">
    <p class="eyebrow">Karim &amp; Danya · 26 . 12 . 26</p>
    <h1 data-t="h">Share your moments</h1>
    <div class="rule" aria-hidden="true"><i></i><svg viewBox="0 0 16 16"><path d="M8 1c1 3 3 5 6 7-3 2-5 4-6 7-1-3-3-5-6-7 3-2 5-4 6-7z" fill="currentColor"/></svg><i></i></div>
    <p class="lead" data-t="lead">Take a photo or a video tonight. It goes straight into our album.</p>

    <label class="name"><span data-t="lName">Your name (optional)</span><input id="guest" autocomplete="name" maxlength="40"></label>

    <div class="acts">
      <label class="act"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.500-2.500h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.200" r="3.600"/></svg><span data-t="photo">Take a photo</span><input id="inPhoto" type="file" accept="image/*" capture="environment"></label>
      <label class="act"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.500" width="12.500" height="11" rx="1.500"/><path d="M15.500 10.500L21 7.500v9l-5.500-3z"/></svg><span data-t="video">Record a video</span><input id="inVideo" type="file" accept="video/*" capture="environment"></label>
      <label class="act ghost"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.500" y="5" width="17" height="14" rx="1.500"/><path d="M3.500 15.500l4.500-4.500 4 4 2.500-2.500 6 6"/><circle cx="15.500" cy="9.500" r="1.300"/></svg><span data-t="pick">Choose from gallery</span><input id="inPick" type="file" accept="image/*,video/*" multiple></label>
    </div>
    <p class="hintline" data-t="hint">Photos get a soft vintage look. Videos are saved as they are.</p>

    <p class="status" id="status" aria-live="polite"></p>
    <p class="keep" id="keep" hidden data-t="keep">Please keep this page open until everything is sent.</p>
    <ul class="queue" id="queue"></ul>
  </main>
  <p class="foot">26 · 12 · 26 &nbsp;·&nbsp; DUBAI</p>
</div>

<script>
(function(){
  // ===== Upload endpoint: Google Apps Script web app that opens an upload session in the Drive album folder. Empty = preview (nothing is saved).
  var ALBUM_ENDPOINT = "";
  var CHUNK = 8 * 1024 * 1024;           // must be a multiple of 256 KB
  var MAX_SIDE = 2400;                   // photos are scaled down to this before the filter

  var T = {
    en:{ h:"Share your moments", lead:"Take a photo or a video tonight. It goes straight into our album.", lName:"Your name (optional)", photo:"Take a photo", video:"Record a video", pick:"Choose from gallery",
      hint:"Photos get a soft vintage look. Videos are saved as they are.", keep:"Please keep this page open until everything is sent.",
      sending:function(n){ return "Sending "+n+(n===1?" file":" files")+"…"; }, allDone:function(n){ return n+(n===1?" memory":" memories")+" added to the album. Thank you!"; },
      prep:"preparing", wait:"waiting", ok:"sent", fail:"failed", retry:"Retry", photoN:"Photo", videoN:"Video", preview:"Preview only: the album is not connected yet." },
    ar:{ h:"شاركونا لحظاتكم", lead:"التقطوا صورة أو فيديو الليلة، وتصل مباشرةً إلى ألبومنا.", lName:"الاسم (اختياري)", photo:"التقاط صورة", video:"تسجيل فيديو", pick:"اختيار من المعرض",
      hint:"تأخذ الصور لمسة كلاسيكية ناعمة، أمّا الفيديو فيُحفظ كما هو.", keep:"من فضلكم أبقوا الصفحة مفتوحة حتى يكتمل الإرسال.",
      sending:function(n){ return "جارٍ إرسال "+n+" ملف…"; }, allDone:function(n){ return "أُضيفت "+n+" ذكرى إلى الألبوم. شكراً لكم!"; },
      prep:"تحضير", wait:"انتظار", ok:"تمّ", fail:"فشل", retry:"إعادة", photoN:"صورة", videoN:"فيديو", preview:"معاينة فقط: الألبوم غير متصل بعد." }
  };
  var lang="en";
  try{ var h=(location.hash||"").replace("#",""); if(h==="ar"||h==="en") lang=h; else { var s=localStorage.getItem("kd-lang"); if(s==="ar"||s==="en") lang=s; } }catch(e){}
  function setLang(l){ lang=l; document.documentElement.lang=l; document.documentElement.dir=l==="ar"?"rtl":"ltr";
    document.querySelectorAll("[data-t]").forEach(function(el){ var v=T[l][el.getAttribute("data-t")]; if(typeof v==="string") el.textContent=v; });
    document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-lang")===l)); });
    try{ localStorage.setItem("kd-lang", l); }catch(e){} refreshStatus(); }
  document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); }); });

  var guest=document.getElementById("guest");
  try{ guest.value=localStorage.getItem("kd-guest")||""; }catch(e){}
  guest.addEventListener("change", function(){ try{ localStorage.setItem("kd-guest", guest.value.trim()); }catch(e){} });

  var queueEl=document.getElementById("queue"), statusEl=document.getElementById("status"), keepEl=document.getElementById("keep");
  var items=[], running=0, MAX_PARALLEL=2, doneCount=0;

  function refreshStatus(){
    var pending=items.filter(function(i){ return i.state==="wait"||i.state==="prep"||i.state==="up"; }).length;
    keepEl.hidden = pending===0;
    if(pending>0) statusEl.textContent=T[lang].sending(pending);
    else if(doneCount>0) statusEl.textContent = ALBUM_ENDPOINT ? T[lang].allDone(doneCount) : T[lang].preview;
    else statusEl.textContent="";
    items.forEach(function(i){ if(i.el) paint(i); });
  }
  function paint(it){
    var st=it.el.querySelector(".st"), bar=it.el.querySelector(".bar i");
    it.el.className = it.state==="done"?"done":(it.state==="fail"?"fail":"");
    bar.style.width = Math.round(it.progress*100)+"%";
    if(it.state==="fail"){ st.innerHTML=""; var b=document.createElement("button"); b.className="retry"; b.type="button"; b.textContent=T[lang].retry; b.onclick=function(){ it.state="wait"; it.progress=0; refreshStatus(); pump(); }; st.appendChild(b); }
    else st.textContent = it.state==="done" ? "✓ "+T[lang].ok : (it.state==="prep" ? T[lang].prep : (it.state==="wait" ? T[lang].wait : Math.round(it.progress*100)+"%"));
    it.el.querySelector(".meta b").textContent = (it.isVideo?T[lang].videoN:T[lang].photoN)+" "+it.n;
  }
  var counter=0;
  function add(file){
    if(!file) return;
    var isVideo=/^video\//.test(file.type) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(file.name||"");
    var isImage=/^image\//.test(file.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name||"");
    if(!isVideo && !isImage) return;
    var it={ file:file, isVideo:isVideo, state:"wait", progress:0, n:++counter };
    var li=document.createElement("li");
    li.innerHTML='<div class="thumb">'+(isVideo?'<svg viewBox="0 0 24 24"><path d="M9 7.500v9l7.500-4.500z"/></svg>':'')+'</div><div class="meta"><b></b><div class="bar"><i></i></div></div><div class="st"></div>';
    it.el=li; queueEl.insertBefore(li, queueEl.firstChild);
    if(!isVideo){ try{ var u=URL.createObjectURL(file); li.querySelector(".thumb").style.backgroundImage="url("+u+")"; it.thumbUrl=u; }catch(e){} }
    items.push(it); refreshStatus(); pump();
  }
  ["inPhoto","inVideo","inPick"].forEach(function(id){ var inp=document.getElementById(id); inp.addEventListener("change", function(){ [].forEach.call(inp.files||[], add); inp.value=""; }); });

  function pump(){
    while(running<MAX_PARALLEL){
      var it=null; for(var k=0;k<items.length;k++){ if(items[k].state==="wait"){ it=items[k]; break; } }
      if(!it) return;
      running++; process(it).then(function(){}, function(){}).then(function(){ running--; refreshStatus(); pump(); });
    }
  }
  function process(it){
    it.state = it.isVideo ? "up" : "prep"; refreshStatus();
    var prep = it.isVideo ? Promise.resolve(it.file) : vintage(it.file).then(function(blob){ if(it.thumbUrl){ try{ URL.revokeObjectURL(it.thumbUrl); }catch(e){} } var u=URL.createObjectURL(blob); it.el.querySelector(".thumb").style.backgroundImage="url("+u+")"; return blob; }, function(){ return it.file; });
    return prep.then(function(blob){ it.state="up"; refreshStatus(); return upload(it, blob); })
      .then(function(){ it.state="done"; it.progress=1; doneCount++; }, function(err){ it.state="fail"; try{ console.log("[album] upload failed", String(err)); }catch(e){} });
  }

  // ===== vintage look: warm tone, lifted blacks, soft contrast, light grain, vignette, small date stamp =====
  function vintage(file){
    return new Promise(function(resolve, reject){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        try{
          var w=img.naturalWidth, h=img.naturalHeight, sc=Math.min(1, MAX_SIDE/Math.max(w,h));
          var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
          var c=document.createElement("canvas"); c.width=cw; c.height=ch; var x=c.getContext("2d");
          x.drawImage(img,0,0,cw,ch); URL.revokeObjectURL(url);
          var id=x.getImageData(0,0,cw,ch), d=id.data, n=d.length, i, r, g, b, l, seed=1234567;
          for(i=0;i<n;i+=4){
            r=d[i]; g=d[i+1]; b=d[i+2];
            l=0.299*r+0.587*g+0.114*b;
            r=l+(r-l)*0.82; g=l+(g-l)*0.82; b=l+(b-l)*0.82;                 // a little less saturated
            r=(r-128)*0.94+128; g=(g-128)*0.94+128; b=(b-128)*0.94+128;     // softer contrast
            r=r*1.05+10; g=g*1.01+6; b=b*0.90+8;                            // warm tone
            r=r*0.93+18; g=g*0.93+16; b=b*0.93+15;                          // lifted blacks, gentle fade
            seed=(seed*1664525+1013904223)|0; var gr=((seed>>>24)-128)/128*7; // fine grain
            d[i]=r+gr; d[i+1]=g+gr; d[i+2]=b+gr;
          }
          x.putImageData(id,0,0);
          var R=Math.sqrt(cw*cw+ch*ch)/2, vg=x.createRadialGradient(cw/2,ch/2,R*0.55,cw/2,ch/2,R*1.02);
          vg.addColorStop(0,"rgba(40,25,10,0)"); vg.addColorStop(1,"rgba(40,25,10,0.34)");
          x.fillStyle=vg; x.fillRect(0,0,cw,ch);
          var fs=Math.max(14, Math.round(Math.min(cw,ch)*0.026));
          x.font="600 "+fs+"px Georgia, 'Times New Roman', serif"; x.textAlign="right"; x.textBaseline="alphabetic";
          x.shadowColor="rgba(40,25,10,.55)"; x.shadowBlur=fs*0.35; x.fillStyle="rgba(255,240,214,.88)";
          x.fillText("Karim & Danya  ·  26 . 12 . 26", cw-fs*1.1, ch-fs*1.0);
          c.toBlob(function(bl){ bl ? resolve(bl) : reject(new Error("toBlob")); }, "image/jpeg", 0.9);
        }catch(e){ reject(e); }
      };
      img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src=url;
    });
  }

  // ===== upload: ask the script for an upload session in the album folder, then send the file to Google Drive in pieces =====
  function pad(n){ return (n<10?"0":"")+n; }
  function fileName(it, blob){
    var d=new Date(), who=(guest.value||"").trim().replace(/[\\/:*?"<>|\u0000-\u001f]+/g," ").slice(0,40);
    var ext = it.isVideo ? ((it.file.name||"").match(/\.([a-z0-9]{2,5})$/i)||[0,(/quicktime/.test(it.file.type)?"mov":"mp4")])[1].toLowerCase() : "jpg";
    return (who?who+" - ":"")+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+"-"+Math.random().toString(36).slice(2,6)+"."+ext;
  }
  function api(body){
    return fetch(ALBUM_ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){ return r.json(); });
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function upload(it, blob){
    if(!ALBUM_ENDPOINT){ // preview: pretend
      var p=0; return new Promise(function(res){ var t=setInterval(function(){ p+=0.2; it.progress=Math.min(1,p); paint(it); if(p>=1){ clearInterval(t); res(); } },180); });
    }
    var mime = it.isVideo ? (it.file.type||"video/mp4") : "image/jpeg", size=blob.size;
    return api({action:"start", name:fileName(it,blob), mimeType:mime, size:size, origin:location.origin}).then(function(r){
      if(!r || !r.ok || !r.url) throw new Error("start: "+(r&&r.error||"no session"));
      var url=r.url, offset=0, direct=true, tries=0;
      function sendDirect(piece, end){
        return new Promise(function(resolve, reject){
          var x=new XMLHttpRequest(); x.open("PUT", url, true);
          x.setRequestHeader("Content-Range","bytes "+offset+"-"+(end-1)+"/"+size);
          x.upload.onprogress=function(e){ if(e.lengthComputable){ it.progress=(offset+e.loaded)/size; paint(it); } };
          x.onload=function(){ (x.status===200||x.status===201||x.status===308) ? resolve(x.status) : reject(new Error("status "+x.status)); };
          x.onerror=function(){ reject(new Error("network")); }; x.ontimeout=function(){ reject(new Error("timeout")); };
          x.send(piece);
        });
      }
      function sendRelay(piece, end){ // fallback: the script forwards the piece to Drive
        return new Promise(function(resolve, reject){ var fr=new FileReader(); fr.onload=function(){ resolve(String(fr.result).split(",")[1]); }; fr.onerror=reject; fr.readAsDataURL(piece); })
          .then(function(b64){ return api({action:"chunk", url:url, offset:offset, end:end, total:size, data:b64}); })
          .then(function(r){ if(!r || !r.ok) throw new Error("relay: "+(r&&r.error||"")); return r.status; });
      }
      function next(){
        if(offset>=size) return Promise.resolve();
        var step = direct ? CHUNK : 4*1024*1024, end=Math.min(size, offset+step), piece=blob.slice(offset,end);
        return (direct?sendDirect(piece,end):sendRelay(piece,end)).then(function(){ offset=end; tries=0; it.progress=offset/size; paint(it); return next(); }, function(err){
          tries++;
          if(direct && offset===0 && tries>=1){ direct=false; tries=0; return next(); }   // the browser could not reach Drive directly: use the relay
          if(tries>4) throw err;
          return sleep(1200*tries).then(next);
        });
      }
      return next();
    });
  }

  window.addEventListener("beforeunload", function(e){ if(items.some(function(i){ return i.state==="up"||i.state==="prep"||i.state==="wait"; })){ e.preventDefault(); e.returnValue=""; } });
  setLang(lang);
})();
</script>
</body>
</html>
